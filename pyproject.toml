[project]
name = "the-learning-of-isaac"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "evdev",
    "matplotlib",
    "numpy",
    "obsws-python>=1.8.0",
    "opencv-python>=5.0.0.93",
    "pillow",
    "pynput",
    "pyright>=1.1.411",
    "pyside6>=6.11.1",
    "ruff>=0.15.22",
    "scikit-learn>=1.9.0",
    "scikit-multilearn",
    "torch",
    "torchcodec>=0.15.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
extend = "/home/mert/.config/ruff/ruff.toml"
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]

ignore = [
    "E501",                           # line too long (handled by formatter)
    "B008",                           # function calls in argument defaults
    "SIM108",                         # use ternary operator (not always clearer)
    "RUF001", "RUF002", "RUF003",     # ambiguous unicode characters
    "ARG005",                         # unused lambda args (tkinter callbacks)
    "PLW2901",                        # loop variable overwrite (PyTorch .to(device))
    "S603",                           # subprocess security (all cmds hardcoded)
    "S607",                           # partial executable path (system tools)
    "UP037",                          # quote removal breaks forward references
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
reportPrivateImportUsage = false
