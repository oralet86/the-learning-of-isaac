[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "ARG",   # flake8-unused-arguments
    "PLW",   # Pylint warnings
    "TCH",   # flake8-type-checking
]

ignore = [
    "E501",                           # line too long (handled by formatter)
    "B008",                           # function calls in argument defaults
    "SIM108",                         # use ternary operator (not always clearer)
    "RUF001", "RUF002", "RUF003",     # ambiguous unicode characters
    "ARG005",                         # unused lambda args (tkinter callbacks)
    "PLW2901",                        # loop variable overwrite (PyTorch .to(device))
    "S603",                           # subprocess security (all cmds hardcoded)
    "S607",                           # partial executable path (system tools)
    "UP037",                          # quote removal breaks forward references
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
show_error_codes = true
